<!DOCTYPE html>
<html>
<head>
  <title>Slaylist</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Slaylist</h1>
  <div class="grid">
    {% for item in items %}
      <div class="card">
        {% if item.image_url %}<img src="{{ item.image_url }}" alt="{{ item.name }}">{% endif %}
        <h3>{{ item.name }}</h3>
        <p>{{ item.status }}</p>
        {% if item.link %}<a href="{{ item.link }}" target="_blank">View product</a>{% endif %}
      </div>
    {% else %}
      <p>Nothing here yet.</p>
    {% endfor %}
  </div>
</body>
</html>
